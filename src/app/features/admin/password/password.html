<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="h3 mb-4">Modifier le mot de passe</h1>

    @if (message()) {
      <div
        class="alert"
        [class.alert-success]="message().includes('succès')"
        [class.alert-danger]="!message().includes('succès')"
      >
        {{ message() }}
      </div>
    }

    <form (submit)="submit(); $event.preventDefault()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="newPassword">Nouveau mot de passe</label>
        <input id="newPassword" type="password" class="form-control" [formField]="passwordForm.password" />
      </div>
      <div class="mb-4">
        <label class="form-label" for="confirmation">Confirmation</label>
        <input id="confirmation" type="password" class="form-control" [formField]="passwordForm.confirmation" />
      </div>
      <button type="submit" class="btn btn-primary">Modifier</button>
    </form>
  </div>
</div>
