@let product = productInput();

<article class="card h-100 shadow-sm" [class.border-success]="product.available">
  <img
    [src]="product.photo"
    class="card-img-top"
    [alt]="product.name"
    style="height: 210px; object-fit: cover"
  />
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start">
      <span class="badge text-bg-secondary">{{ product.category }}</span>
      <button
        type="button"
        class="btn btn-sm"
        [class.btn-danger]="favorite()"
        [class.btn-outline-danger]="!favorite()"
        (click)="toggleFavorite.emit(product.id)"
        [attr.aria-label]="favorite() ? 'Retirer des favoris' : 'Ajouter aux favoris'"
      >
        <i [class]="favorite() ? 'bi bi-heart-fill' : 'bi bi-heart'" aria-hidden="true"></i>
      </button>
    </div>
    <h2 class="h5 mt-3">{{ product.name }}</h2>
    <p class="fw-bold text-primary">{{ product.price | tndPrice }}</p>
    <p class="small" [class.text-success]="product.available" [class.text-danger]="!product.available">
      {{ product.available ? 'Disponible' : 'Indisponible' }}
    </p>
    <a
      class="btn btn-dark mt-auto"
      [routerLink]="['/shop/product', product.id]"
    >
      Voir le détail
    </a>
  </div>
</article>
